<ion-content class="ion-padding">
  <ion-grid class="full-height">
    <ion-row class="full-height ion-align-items-center ion-justify-content-center">
      <ion-col size="12" size-md="6" size-lg="5">
        <div class="form-container">
          <ion-button fill="clear" routerLink="/landing" size="small">
            <ion-icon name="arrow-back-outline" slot="start"></ion-icon> Volver al inicio
          </ion-button>

          <h2 class="ion-no-margin ion-margin-top">Crear Cuenta en ReFix</h2>
          <p class="ion-color-medium">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>

          <form (ngSubmit)="onRegister()">
            <ion-item fill="outline" class="ion-margin-top">
              <ion-label position="floating">Nombre Completo</ion-label>
              <ion-input type="text" placeholder="Tu nombre completo" required></ion-input>
            </ion-item>

            <ion-item fill="outline" class="ion-margin-top">
              <ion-label position="floating">Correo Electrónico</ion-label>
              <ion-input type="email" placeholder="correo@ejemplo.com" required></ion-input>
            </ion-item>

            <ion-item fill="outline" class="ion-margin-top">
              <ion-label position="floating">Contraseña</ion-label>
              <ion-input type="password" required></ion-input>
            </ion-item>

            <ion-button expand="block" color="primary" class="ion-margin-top" type="submit">
              Registrarse →
            </ion-button>
          </form>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
